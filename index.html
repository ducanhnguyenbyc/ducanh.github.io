<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trắc nghiệm Máy bay</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; max-width: 600px; }
    h1 { color: #2c3e50; }
    .question { font-size: 1.2em; margin-top: 20px; }
    .options { margin-top: 10px; }
    .options label { display: block; margin-bottom: 5px; }
    button { margin-top: 20px; padding: 10px 20px; font-size: 1em; }
    .result { margin-top: 30px; font-weight: bold; color: green; }
    .wrong { color: red; }
  </style>
</head>
<body>
  <h1>Trắc nghiệm Máy bay</h1>
  <div id="quiz"></div>
  <div id="result" class="result"></div>

  <script>
    const questions = [
      {
        question: "Máy bay nào có thời gian hoạt động dài nhất?",
        options: ["B-1B Lancer", "MQ-9 Reaper", "F-22 Raptor", "F/A-18 Super Hornet"],
        answer: "MQ-9 Reaper"
      },
      {
        question: "F-35 Lightning II là loại máy bay gì?",
        options: ["Ném bom", "Tiêm kích đa nhiệm tàng hình", "Trinh sát điện tử", "Tuần tra biển"],
        answer: "Tiêm kích đa nhiệm tàng hình"
      },
      {
        question: "Máy bay nào có sải cánh lớn nhất?",
        options: ["F-15 Eagle", "MQ-4C Triton", "B-1B Lancer", "E-2C Hawkeye"],
        answer: "MQ-4C Triton"
      },
      {
        question: "RC-135 Rivet Joint thuộc loại gì?",
        options: ["Trinh sát điện tử", "Tiêm kích", "Ném bom", "Tuần tra biển"],
        answer: "Trinh sát điện tử"
      },
      {
        question: "F-22 Raptor có trần bay khoảng bao nhiêu?",
        options: ["12.000 m", "15.000 m", "20.000 m", "25.000 m"],
        answer: "20.000 m"
      },
      {
        question: "X-47B là máy bay gì?",
        options: ["UAV thử nghiệm", "Máy bay tiêm kích", "Ném bom tàng hình", "Cảnh báo sớm"],
        answer: "UAV thử nghiệm"
      }
    ];

    let current = 0;
    let score = 0;
    let wrongAnswers = [];

    function showQuestion() {
      const quiz = document.getElementById("quiz");
      const q = questions[current];
      quiz.innerHTML = `
        <div class="question">Câu ${current + 1}: ${q.question}</div>
        <div class="options">
          ${q.options.map((opt, i) => `
            <label><input type="radio" name="option" value="${opt}"> ${opt}</label>
          `).join('')}
        </div>
        <button onclick="submitAnswer()">Trả lời</button>
      `;
    }

    function submitAnswer() {
      const selected = document.querySelector('input[name="option"]:checked');
      if (!selected) {
        alert("Vui lòng chọn một đáp án!");
        return;
      }

      const answer = selected.value;
      if (answer === questions[current].answer) {
        score++;
      } else {
        wrongAnswers.push({
          question: questions[current].question,
          chosen: answer,
          correct: questions[current].answer
        });
      }

      current++;
      if (current < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      const quiz = document.getElementById("quiz");
      const result = document.getElementById("result");
      quiz.innerHTML = "";
      result.innerHTML = `<div>Bạn đúng ${score}/${questions.length} câu.</div>`;

      if (wrongAnswers.length > 0) {
        result.innerHTML += "<br><div class='wrong'>Các câu sai:</div>";
        wrongAnswers.forEach(q => {
          result.innerHTML += `<div>❌ ${q.question}<br>👉 Bạn chọn: ${q.chosen}<br>✅ Đúng: ${q.correct}</div><br>`;
        });
      }
    }

    // Bắt đầu hiển thị
    showQuestion();
  </script>
</body>
</html>
